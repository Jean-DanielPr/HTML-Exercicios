<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 17 - HMTL</title>
</head>
<body>
    <h1>Cadastro Pessoal</h1>
    <form action="paginaCadastro.jsp" method="post">
        <fieldset>
                <legend>Informações Pessoais</legend>
            <div>    
                <label for="">Nome Completo:</label><br>
                <input type="text" name="txtNome" id="txtNome" placeholder="Digite seu nome completo" required>
            </div>
            <br>
            <div>
                <label for="">E-mail:</label><br>
                <input type="email" name="txtEmail" id="txtEmail" placeholder="exemplo@gmail.com" required>
            </div>
            <br>
            <div>
                <label for="">Ano de nascimento:</label><br> 
                <input type="number" name="numAnoNascimento" id="numAnoNascimento" min="1950" max="2026">
            </div>
            <br>
            <div>
                <label for="">Data de nascimento:</label><br> 
                <input type="date" name="txtDataNascimento" id="txtDataNascimento" min="1950" max="2026">
            </div>
            <br>
            <div>
                <label for="">Horário preferido de estudo:</label><br>
                <input type="time" name="horaPreferencia" id="horaPreferencia">
            </div>
            <br>
            <button type="submit">Salvar</button>
        </fieldset>
    </form>
</body>
</html>
