<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 19 - HTML</title>
</head>

<body>
    <h1>Cadastro de Pessoas</h1>

    <form action="cadastro.psx" method="post">
        <fieldset>
            <legend>Cadastro</legend>
            <div>
                <label for="text">Nome completo:</label><br>
                <input type="text" name="nomeTxt" id="nomeTxt" required>
            </div>
            <br>
            <div>
                <label for="email">Email:</label><br>
                <input type="email" name="emailCadastrado" id="emailCadastrado" required
                    placeholder="seuemail@gmail.com" required>
            </div>
            <br>
            <div>
                <label for="number">Idade:</label>
                <input type="number" name="idadeAtual" id="idadeAtual" min="14" max="100" required>
            </div>
            <br>
            <div>
                <label for="date">Data do evento:</label>
                <input type="date" name="dataEvento" id="datEvento" min="2026-09-13">
            </div>
            <br>
            <div>
                <label for="time">Horário Preferido:</label>
                <input type="time" name="horaPreferida" id="horaPreferida">
            </div>
            <br>
            <div>
                <label for="radio">Modalidade do Evento:</label><br>
                <input type="radio" name="modalidadeEvento" id="modalidadeEvento" value="1">Presencial
                <br>
                <input type="radio" name="modalidadeEvento" id="modalidadeEvento" value="2">Online
                <br>
                <input type="radio" name="modalidadeEvento" id="modalidadeEvento" value="3">Híbrido
                <br>
            </div>
            <br>
            <div>
                <label for="checkbox">Área de interesse:</label><br>
                <input type="checkbox" name="chkAreaInteresse" id="chkAreaInteresse" value="1">Tecnologia e Inovação
                <br>
                <input type="checkbox" name="chkAreaInteresse" id="chkAreaInteresse" value="2">Saúde e Bem-Estar
                <br>
                <input type="checkbox" name="chkAreaInteresse" id="chkAreaInteresse" value="3">Educação e Pedagogia
                <br>
                <input type="checkbox" name="chkAreaInteresse" id="chkAreaInteresse" value="4">Negócios e
                Empreendedorismo
                <br>
                <input type="checkbox" name="chkAreaInteresse" id="chkAreaInteresse" value="5">Entretenimento e Cultura
                Pop
                <br>
            </div>
            <br>
            <div>
                <label for="select">Região:</label><br>
                <select name="regiaoBrasil" id="regiaoBrasil">
                    <option value="1">Norte</option>
                    <option value="2">Nordeste</option>
                    <option value="3">Centro-Oeste</option>
                    <option value="4">Sudeste</option>
                    <option value="5">Sul</option>
                </select>
                <br>
            </div>
            <div>
                <label for="color">Cor do Crachá:</label><br>
                <input type="color" name="corCrachá" id="corCrachá">
                <br>
            </div>
            <div>
                <label for="range">Nível de Expectativa:</label><br>
                <input type="range" name="nivelExpectativa" id="nivelExpectativa" min="0" max="100" step="1">
            </div>
        </fieldset>
        <br>
        <div>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </div>
    </form>

</body>

</html>
